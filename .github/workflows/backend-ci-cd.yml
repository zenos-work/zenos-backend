name: Backend CI/CD

on:
  push:
    branches:
      - development
      - staging
      - master

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  call-reusable-workflow:
    name: Backend CI/Deploy
    # Runs on push to any promotion branch.
    # Deploy only happens when merging promotion PRs (development→staging, staging→master)
    uses: zenos-work/zenos-infra/.github/workflows/backend-ci-deploy.yml@development
    with:
      # Set environment based on target branch after merge
      environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || github.ref == 'refs/heads/master' && 'production' || 'staging' }}
      run_deploy: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master' }}
      min_coverage: ${{ vars.BACKEND_MIN_COVERAGE || '80' }}
    secrets: inherit

  smoke-test:
    name: Backend Smoke Test
    needs: call-reusable-workflow
    # Only run smoke test after successful push to staging or master (merged promotion PRs)
    if: success() && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backend smoke test
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh
        env:
          SMOKE_ENV: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
          API_BASE_URL: ${{ (github.event.pull_request.base.ref == 'staging' && github.event.pull_request.head.ref == 'development') && 'https://staging.api.zenos.work' || 'https://api.zenos.work' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
