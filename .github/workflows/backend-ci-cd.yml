name: Backend CI/CD

on:
  push:
    branches:
      - development
      - staging
      - master

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-context:
    name: Resolve Branch Context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      run_deploy: ${{ steps.resolve.outputs.run_deploy }}

    steps:
      - name: Resolve environment and deploy flag
        id: resolve
        run: |
          branch="${GITHUB_REF#refs/heads/}"

          case "$branch" in
            staging)
              environment="staging"
              run_deploy="true"
              ;;
            master)
              environment="production"
              run_deploy="true"
              ;;
            *)
              environment="staging"
              run_deploy="false"
              ;;
          esac

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "run_deploy=${run_deploy}" >> "$GITHUB_OUTPUT"

  call-reusable-workflow:
    name: Backend CI/Deploy
    needs: resolve-context
    uses: zenos-work/zenos-infra/.github/workflows/backend-ci-deploy.yml@development
    with:
      environment: ${{ needs.resolve-context.outputs.environment }}
      run_deploy: ${{ needs.resolve-context.outputs.run_deploy == 'true' }}
      min_coverage: ${{ vars.BACKEND_MIN_COVERAGE || '80' }}
    secrets: inherit

  smoke-test:
    name: Backend Smoke Test
    needs:
      - resolve-context
      - call-reusable-workflow
    if: success() && needs.resolve-context.outputs.run_deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-context.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backend smoke test
        run: |
          chmod +x ./scripts/smoke_test.sh
          ./scripts/smoke_test.sh
        env:
          SMOKE_ENV: ${{ needs.resolve-context.outputs.environment }}
          API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL || vars.API_BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
